name: CI (Windows gcc-x64)

on:
  push:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    # 1. MSYS2環境の構築（gcc-x64に必要なパッケージと ccache をインストール）
    - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
      with:
        msystem: UCRT64
        install: >-
          git
          make
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-python
          mingw-w64-ucrt-x86_64-lld
          mingw-w64-ucrt-x86_64-llvm
          mingw-w64-ucrt-x86_64-libc++
          mingw-w64-ucrt-x86_64-sdl3
          mingw-w64-ucrt-x86_64-ccache
    
    - uses: actions/checkout@main
      with:
        fetch-depth: 0

    # 2. GitHub Actions のキャッシュ機能をセットアップ
    - name: ccache cache
      uses: actions/cache@v4
      with:
        path: .ccache
        # コミットハッシュではなく、ブランチ名やリファレンスをキーにする
        key: ${{ runner.os }}-gcc-x64-ccache-${{ github.ref_name }}-${{ github.sha }}
        # ヒットしなかった場合に、過去の同名ブランチ（またはデフォルトブランチ）のキャッシュをフォールバックとして部分一致（前方一致）で取得する
        restore-keys: |
          ${{ runner.os }}-gcc-x64-ccache-${{ github.ref_name }}-
          ${{ runner.os }}-gcc-x64-ccache-

    # 3. ビルドの実行（ccache を強制適用）
    - name: Build
      env:
        OVERRIDE_AR: "llvm-ar"
        OVERRIDE_CC: "ccache gcc"
        OVERRIDE_CXX: "ccache g++"
        ARCHOPTS: "-fuse-ld=lld"
        SUBTARGET: mame
        TOOLS: 1
        USE_SDL3: 1
      run: |
        # ccacheの動作設定（ワークスペース内の .ccache フォルダに保存させる）
        export CCACHE_DIR="${{ github.workspace }}/.ccache"
        ccache --max-size=2G
        ccache --zero-stats
        
        make -j3
        
        # ログにキャッシュのヒット率を出力して確認できるようにする
        ccache --show-stats

    # 4. バリデーションチェック
    - name: Validate
      run: ./mame.exe -validate

    # 5. 成果物（exeファイル群）のアップロード
    - uses: actions/upload-artifact@main
      with:
        name: mame-windows-gcc-x64-${{ github.sha }}
        path: |
          mame.exe
          chdman.exe
          unidasm.exe
        if-no-files-found: error
